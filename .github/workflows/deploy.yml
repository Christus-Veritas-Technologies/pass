name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone, build and start with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.167.122.185
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 30m
          envs: SERVER_ENV_B64,WEB_ENV_B64
          script: |
            set -e
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
            if [ ! -d /var/www/pass ]; then
              mkdir -p /var/www && git clone https://github.com/christus-veritas-technologies/pass /var/www/pass
            fi
            cd /var/www/pass
            git fetch origin master && git reset --hard origin/master
            echo "$SERVER_ENV_B64" | base64 -d > apps/server/.env
            echo "$WEB_ENV_B64" | base64 -d > apps/web/.env
            bun install && bun run build
            pm2 delete pass-server 2>/dev/null || true
            pm2 delete pass-web 2>/dev/null || true
            pm2 start "bun run start" --name pass-server --cwd /var/www/pass/apps/server
            pm2 start "bun run start" --name pass-web --cwd /var/www/pass/apps/web
            pm2 save
            sleep 8
            pm2 list
            echo "=== Server logs ===" && pm2 logs pass-server --lines 30 --nostream || true
            echo "=== Web logs ===" && pm2 logs pass-web --lines 30 --nostream || true
            echo "=== Port check ===" && ss -tlnp | grep -E '5005|5006' || echo "WARNING: expected ports not found"
        env:
          SERVER_ENV_B64: ${{ secrets.SERVER_ENV_B64 }}
          WEB_ENV_B64: ${{ secrets.WEB_ENV_B64 }}

      - name: Configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.167.122.185
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            apt-get install -y nginx
            cat > /etc/nginx/sites-available/pass-web << 'WEOF'
            server {
              listen 80;
              server_name pass.co.zw www.pass.co.zw;
              location / {
                proxy_pass http://127.0.0.1:5005;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
            WEOF
            cat > /etc/nginx/sites-available/pass-api << 'AEOF'
            server {
              listen 80;
              server_name api.pass.co.zw;
              location / {
                proxy_pass http://127.0.0.1:5006;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
            AEOF
            ln -sf /etc/nginx/sites-available/pass-web /etc/nginx/sites-enabled/
            ln -sf /etc/nginx/sites-available/pass-api /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx

      - name: Issue SSL certificates
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.167.122.185
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            certbot --nginx -d pass.co.zw -d www.pass.co.zw -d api.pass.co.zw \
              --non-interactive --agree-tos -m kinzinzombe07@gmail.com --redirect \
              --keep-until-expiring || \
              echo "Certbot failed - ensure DNS records point to this server first"
            nginx -t && systemctl reload nginx
